# ╭──────────────────────────────────────────────────────────────────────────────────╮
# │  $mod key map  ─  _ unbound  ·  X = $mod+X  ·  X+ = $mod+shift+X also bound     │
# ├────┬────┬────┬────┬────┬────┬────┬────┬────┬────┬────┬────┬────┬──────────────┤
# │ _  │ 1+ │ 2+ │ 3+ │ 4+ │ 5+ │ 6+ │ 7+ │ 8+ │ 9+ │ 0+ │ -+ │ _  │    bksp     │
# ├──────┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴────────────┤
# │ tab  │ _+ │ _  │ _  │ r+ │ t  │ y  │ u  │ i  │ o  │ p  │ _  │ _             │
# ├───────┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴───────────────┤
# │ caps  │ _  │ s+ │ _  │ _  │ _  │ h+ │ j+ │ k+ │ l+ │ _  │      enter        │
# ├────────┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴┬───┴───────────────────┤
# │ shift  │ _  │ _  │ c  │ v  │ b  │ n  │ m  │ _  │ _  │ /  │     shift        │
# ├────────┴────┴────┴───────────────────────────────────────────────┬───┬───┬───┬──┤
# │  ctrl   alt                    SPC+                  alt   ctrl  │ _ │ ↑ │ ↓ │→ │
# ╰──────────────────────────────────────────────────────────────────┴───┴───┴───┴──╯

# =============================================================================
# hyprland.conf — translated from i3 config
# =============================================================================

env = GTK_THEME,Adwaita:dark

# -----------------------------------------------------------------------------
# MONITORS
# -----------------------------------------------------------------------------
# eDP-1 = laptop screen (primary), DP-1 = external (right of laptop)
# Adjust resolutions/positions to match your actual hardware
monitor = eDP-1, preferred, 0x0, 1
monitor = DP-1,  preferred, auto-right, 1
# Fallback for any other connected output
monitor = ,preferred,auto,1


# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------
general {
    border_size = 1
    gaps_in = 4
    gaps_out = 6

    # Focused border — your #4cff99 accent
    #col.active_border   = rgb(4cff99)
    col.active_border   = rgb(ffffff)
    # Unfocused border — near-invisible like your i3 setup
    col.inactive_border = rgb(222222)

    layout = dwindle
    resize_on_border = true   # allows mouse-edge resizing like i3
}


# -----------------------------------------------------------------------------
# DECORATION (replaces picom_MINIMAL)
# -----------------------------------------------------------------------------
decoration {
    rounding = 4

    # Subtle shadow only — keeps it minimal like your picom config
    shadow {
        enabled  = true
        range    = 8
        render_power = 2
        color    = rgba(00000066)
    }

    # Very light blur on floating windows only (wallpaper shows through)
    blur {
        enabled  = true
        size     = 4
        passes   = 1
        new_optimizations = true
    }
}


# -----------------------------------------------------------------------------
# ANIMATIONS
# -----------------------------------------------------------------------------
animations {
    enabled = true

    bezier = snappy, 0.25, 0.46, 0.45, 0.94

    animation = windows,     1, 3, snappy, slide
    animation = windowsOut,  1, 2, snappy, slide
    animation = fade,        1, 3, snappy
    animation = workspaces,  1, 3, snappy, slide
}


# -----------------------------------------------------------------------------
# INPUT — translated from your xinput touchpad rules
# -----------------------------------------------------------------------------
input {
    kb_layout = us,ro,ru
    kb_variant = ,std,phonetic
    #kb_options=grp:caps_toggle
    #kb_options=grp:shifts_toggle
    #kb_options=grp:alt_shift_toggle

    touchpad {
        natural_scroll   = true    # xinput Natural Scrolling Enabled 1
        tap-to-click     = true    # xinput Tapping Enabled 1
        # button_map = lrm          # matches your xinput set-button-map 1 2 3 4 5 6 7
    }

    follow_mouse = 1
    sensitivity  = 0
}


# -----------------------------------------------------------------------------
# DWINDLE LAYOUT (closest to i3's tiling behaviour)
# -----------------------------------------------------------------------------
dwindle {
    #pseudotile     = false
    preserve_split = true
    force_split    = 2       # always split to the right/bottom like i3
    smart_split    = false
}


# -----------------------------------------------------------------------------
# MISC
# -----------------------------------------------------------------------------
misc {
    disable_hyprland_logo  = true
    disable_splash_rendering = true
    focus_on_activate      = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
}

cursor {
    inactive_timeout    = 1
}

gestures {
# 1:1 trackpad swipe between workspaces
    gesture = 3, horizontal, workspace

    # optional tuning (these still work in 0.51+)
    workspace_swipe_distance    = 700   # px to complete a full swipe
    workspace_swipe_invert      = true # natural scroll direction
    workspace_swipe_cancel_ratio = 0.2  # how far to commit (0-1)
}

