# -----------------------------------------------------------------------------
# STARTUP — replaces your exec_always block
# -----------------------------------------------------------------------------

# Wallpaper (hyprpaper) — replaces feh + xwinwrap
# Create ~/.config/hypr/hyprpaper.conf pointing at ~/images/wallpapers/black.png
exec-once = hyprpaper

# Screenshot daemon — replaces flameshot (grim+slurp is the Wayland native stack)
# exec-once = flameshot          # flameshot works under Xwayland too if you prefer

# Hide cursor after 1s of inactivity — replaces unclutter + stop_cursor
exec-once = hypridle           # configure ~/.config/hypr/hypridle.conf
exec-once = hyprctl setcursor Bibata-Modern-Classic 48

# Notification daemon — replaces whatever you had
exec-once = mako

# Rofi alternative
exec-once = systemctl --user start elephant.service
exec-once = walker --gapplication-service  # run as service for instant launch

# Bar
exec-once = waybar && sleep 2 && killall -SIGUSR1 waybar  # toggle waybar visibility on startup (autohide)

# Screenshot tool
exec-once = flameshot


# =============================================================================
# KEYBINDINGS
# All $mod bindings translated 1:1 from i3
# =============================================================================

$mod = SUPER


# -----------------------------------------------------------------------------
# Focus (hjkl) — identical to i3
# -----------------------------------------------------------------------------
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r


# -----------------------------------------------------------------------------
# Move windows (Shift+hjkl) — identical to i3
# -----------------------------------------------------------------------------
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r


# -----------------------------------------------------------------------------
# Workspaces 1–10 ($mod+1..0) and 11 ($mod+minus)
# Pinned to DP-1 like in your i3 config
# -----------------------------------------------------------------------------
bind = $mod, 1,     workspace, 1
bind = $mod, 2,     workspace, 2
bind = $mod, 3,     workspace, 3
bind = $mod, 4,     workspace, 4
bind = $mod, 5,     workspace, 5
bind = $mod, 6,     workspace, 6
bind = $mod, 7,     workspace, 7
bind = $mod, 8,     workspace, 8
bind = $mod, 9,     workspace, 9
bind = $mod, 0,     workspace, 10
bind = $mod, minus, workspace, 11

# Move container to workspace ($mod+Shift+1..0 and minus)
bind = $mod SHIFT, 1,     movetoworkspace, 1
bind = $mod SHIFT, 2,     movetoworkspace, 2
bind = $mod SHIFT, 3,     movetoworkspace, 3
bind = $mod SHIFT, 4,     movetoworkspace, 4
bind = $mod SHIFT, 5,     movetoworkspace, 5
bind = $mod SHIFT, 6,     movetoworkspace, 6
bind = $mod SHIFT, 7,     movetoworkspace, 7
bind = $mod SHIFT, 8,     movetoworkspace, 8
bind = $mod SHIFT, 9,     movetoworkspace, 9
bind = $mod SHIFT, 0,     movetoworkspace, 10
bind = $mod SHIFT, minus, movetoworkspace, 11

# Workspace output assignments (eDP-1 for ws 1–10, like i3)
workspace = 1, monitor:eDP-1, default:true
workspace = 7, monitor:DP-1, default:true
#workspace = 1,  persistent:true
#workspace = 2,  persistent:true
#workspace = 3,  persistent:true
#workspace = 4,  persistent:true
#workspace = 5,  persistent:true
#workspace = 6,  persistent:true
#workspace = 7,  persistent:true
#workspace = 8,  persistent:true
#workspace = 9,  persistent:true
#workspace = 10, persistent:true
# Force monitor for workspace
#workspace = 1,  monitor:eDP-1, persistent:true
#workspace = 2,  monitor:eDP-1, persistent:true
#workspace = 3,  monitor:eDP-1, persistent:true
#workspace = 4,  monitor:eDP-1, persistent:true
#workspace = 5,  monitor:eDP-1, persistent:true
#workspace = 6,  monitor:eDP-1, persistent:true
#workspace = 7,  monitor:eDP-1, persistent:true
#workspace = 8,  monitor:eDP-1, persistent:true
#workspace = 9,  monitor:eDP-1, persistent:true
#workspace = 10, monitor:eDP-1, persistent:true

#workspace = 1,  monitor:eDP-1
#workspace = 4,  monitor:eDP-1
#workspace = 5,  monitor:eDP-1
#workspace = 6,  monitor:eDP-1
#workspace = 7,  monitor:eDP-1
#workspace = 8,  monitor:eDP-1
#workspace = 9,  monitor:eDP-1
#workspace = 10, monitor:eDP-1

# Smart gaps:
workspace = w[t1], gapsout:0, gapsin:0
workspace = w[tg1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

# Move workspace to another monitor ($mod+Ctrl+Shift+h/l)
bind = $mod CTRL SHIFT, h, movecurrentworkspacetomonitor, l
bind = $mod CTRL SHIFT, l, movecurrentworkspacetomonitor, r


# -----------------------------------------------------------------------------
# Resize mode — $mod+r then hjkl, Escape or Return to exit
# (Hyprland does resize as a submap, same concept as i3 mode)
# -----------------------------------------------------------------------------
bind = $mod, r, submap, resize

submap = resize
binde = , h, resizeactive, -20 0
binde = , j, resizeactive, 0 20
binde = , k, resizeactive, 0 -20
binde = , l, resizeactive, 20 0
bind  = , Return, submap, reset
bind  = , Escape, submap, reset
bind  = $mod, r, submap, reset
submap = reset


# -----------------------------------------------------------------------------
# Window management — translated from i3 Special section
# -----------------------------------------------------------------------------

# Mouse binds — move and resize floating windows (equivalent to i3's floating_modifier)
bindm = $mod, mouse:272, movewindow    # Super + Left click drag = move
bindm = $mod, mouse:273, resizewindow  # Super + Right click drag = resize

# Kill focused window ($mod+Shift+q)
bind = $mod SHIFT, q, killactive

# Fullscreen toggle ($mod+o)
bind = $mod, o, fullscreen, 0

# Toggle floating ($mod+Shift+Space)
bind = $mod SHIFT, space, togglefloating

# Focus toggle tiling/floating ($mod+Space)
# Cycles focus to the last active floating window and back
bind = $mod, space, cyclenext, floating

# Sticky (keep on all workspaces) ($mod+s)
bind = $mod, s, pin

# Split direction — Hyprland dwindle splits automatically, but you can
# preselect the split direction to match $mod+b (horizontal) / $mod+v (vertical)
bind = $mod, b, layoutmsg, preselect r   # force split right (horizontal)
bind = $mod, v, layoutmsg, preselect d   # force split down  (vertical)

# Restart/reload Hyprland config ($mod+Shift+r — was i3 restart)
bind = $mod SHIFT, r, exec, hyprctl reload


# -----------------------------------------------------------------------------
# Audio — identical XF86 keys
# -----------------------------------------------------------------------------
bind  = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind  = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind  = , XF86AudioMute,        exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
#bind  = , XF86AudioMicMute,     exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
# More close to hardware toggle
bind  = , XF86AudioMicMute,     exec, /home/vlad/bin/toggle-mic
#bind  = , XF86WebCam,        exec, notify-send "debug"
bind  = , XF86WebCam,        exec, /home/vlad/bin/toggle-camera

#bind  = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +1%
#bind  = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -1%
#bind  = SHIFT, XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
#bind  = SHIFT, XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%


# -----------------------------------------------------------------------------
# Brightness
# -----------------------------------------------------------------------------
bind  = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bind  = , XF86MonBrightnessDown, exec, brightnessctl set 5%-


# -----------------------------------------------------------------------------
# Custom shortcuts — translated from i3 Shortcuts section
# -----------------------------------------------------------------------------

# Cycle i3 configs / wallpapers (your custom scripts — keep the same paths)
bind = $mod, right, exec, /home/vlad/bin/i3-config-next
bind = $mod, up,   exec, /home/vlad/bin/wallpaper-next
bind = $mod, down, exec, /home/vlad/bin/wallpaper-next -1

# Toggle layout ($mod+u)
# In hyprland, change the input config directly
#bind = $mod, u, exec, /home/vlad/bin/toggle-layout
bind = $mod, u, exec, hyprctl switchxkblayout all next

# App launcher ($mod+slash → rofi/wofi/walker)
# App launcher ($mod+slash → walker)
bind = $mod, slash, exec, walker

# Terminal ($mod+Return)
bind = $mod, Return, exec, alacritty

# Screenshot ($mod+Shift+s) — grim+slurp is the Wayland-native equivalent of flameshot gui
#bind = $mod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy
# + Annotate
#bind = $mod SHIFT, s, exec, grim -g "$(slurp)" - | satty --filename -
#bind = $mod SHIFT, s, exec, grimblast --notify copysave area ~/images/screenshots/$(date +%Y-%m-%d_%H-%M-%S).png | swappy -f -
# Pair with flameshot in exec once to start the widget
bind = $mod SHIFT, s, exec, flameshot gui
#bind = $mod SHIFT, s, exec, flameshot gui --path ~/images/screenshots --clipboard # This doesn't allwo custom save path/ copy keybind

# Screenshot → OCR ($mod+Shift+t) — replaces flameshot|tesseract|xsel pipeline
#bind = $mod SHIFT, t, exec, grim -g "$(slurp)" - | tesseract stdin stdout | wl-copy

# Scratchpad ($mod+i)
bind = $mod, i, exec, /home/vlad/bin/scratchpad

# Notes ($mod+n)
bind = $mod, n, exec, /home/vlad/bin/notes

# Apple Music in Firefox ($mod+m)
bind = $mod, m, exec, firefox --no-remote --class=AppleMusic -P 'no-gui' 'https://music.apple.com/ro/'

# Toggle top waybar ($mod+t)
bind = $mod, t, exec, killall -SIGUSR1 waybar

# Clipboard save/restore ($mod+y / $mod+p)
# wl-copy/wl-paste replace xsel on Wayland
bind = $mod, y, exec, wl-paste > /home/vlad/.clipboard
bind = $mod, p, exec, cat /home/vlad/.clipboard | wl-copy


# Speech to text toggle (added by hyprwhspr setup)
#bind = $mod, a, exec, hyprwhspr record toggle

# Launch file explorer (Nautilus) with $mod+e
# Use $mod+/ for walker instead and then press . for file explorer mode
#bind = $mod, e, gio open /home/vlad


# Lock screen ($mod+c)
bind = $mod, c, exec, hyprlock
bind = $mod SHIFT, backspace, exec, systemctl hibernate


# -----------------------------------------------------------------------------
# WINDOW RULES — Hyprland 0.53+ syntax
# Syntax: windowrule = rule on, match:class ^regex$
# -----------------------------------------------------------------------------

# To find class, run hyprctl clients | grep -C3 class

# Scratchpad — floating
windowrule = float on, match:class ^__scratchpad$

# Notes — floating, sticky, sized
windowrule = float on,       match:class ^__notes$
windowrule = pin on,         match:class ^__notes$
windowrule = size 1600 1000, match:class ^__notes$

# Apple Music — floating, sticky, sized
windowrule = float on,     match:class ^AppleMusic$
windowrule = pin on,       match:class ^AppleMusic$
windowrule = size 400 400, match:class ^AppleMusic$

# Satty (screenshot editor) — floating, sticky, sized
windowrule = float on,       match:class ^com.gabm.satty$
windowrule = pin on,         match:class ^com.gabm.satty$
#windowrule = size 1600 1000, match:class ^com.gabm.satty$

windowrule = float on,       match:class ^org.pulseaudio.pavucontrol$
windowrule = pin on,         match:class ^org.pulseaudio.pavucontrol$
windowrule = size 1600 1000, match:class ^org.pulseaudio.pavucontrol$

windowrule = float on,       match:class ^__floating_nmtui$
windowrule = pin on,         match:class ^__floating_nmtui$
windowrule = size 1000 800, match:class ^__floating_nmtui$

windowrule = float on,       match:class ^org.gnome.Nautilus$
windowrule = pin on,         match:class ^org.gnome.Nautilus$
windowrule = size 1600 1000, match:class ^org.gnome.Nautilus$

windowrule = float on,       match:class ^gnuplot_qt$
windowrule = pin on,         match:class ^gnuplot_qt$
windowrule = size 1600 1000, match:class ^gnuplot_qt$

windowrule = animation off, match:class ^flameshot$ # this turns off on some motions
windowrule = float on, match:class ^flameshot$, match:title ^flameshot-pin$ # this turns off on some motions
windowrule = pin on, match:class ^flameshot$, match:title ^flameshot-pin$ # this turns off on some motions
#windowrule = match:class flameshot, no_anim on


# =============================================================================
# NOTES FOR MIGRATION
# =============================================================================
#
# 1. CLIPBOARD: xsel/xclip don't work on native Wayland. Install wl-clipboard:
#    yay -S wl-clipboard
#    wl-copy / wl-paste replace xsel -ib / xsel -o
#    Your scratchpad/notes scripts that use xsel will need updating too.
#
# 2. SCREENSHOT: grim + slurp replace flameshot on Wayland.
#    yay -S grim slurp
#    If you prefer keeping flameshot, it works via XWayland with:
#    WAYLAND_DISPLAY="" flameshot gui
#
# 3. WALLPAPER: create ~/.config/hypr/hyprpaper.conf:
#    preload = ~/images/wallpapers/black.png
#    wallpaper = ,~/images/wallpapers/black.png
#
# 4. CURSOR: hypridle handles screen timeout. For cursor hiding, install:
#    yay -S hyprland-per-window-layout   # or use seat { hide_cursor_timeout = 1000 }
#    Add to input {}: hide_cursor_timeout = 1000  (1 second, matches unclutter)
#
# 5. FOCUS WRAPPING: focus_wrapping no in i3 → no direct equivalent needed,
#    Hyprland doesn't wrap focus by default.
#
# 6. YOUR SCRIPTS: /home/vlad/bin/* scripts that use X11 tools (xprop, xdotool,
#    xsel, xrandr) will need Wayland equivalents or Xwayland shims.
#    - xrandr      → wlr-randr or hyprctl monitors
#    - xsel        → wl-clipboard
#    - xprop       → hyprctl clients
# hyprwhspr - Toggle mode (added by hyprwhspr setup)
# Press once to start, press again to stop
